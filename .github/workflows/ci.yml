name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Tests
        run: pytest
      - name: Retrieval evaluation
        run: terkeka-rag-eval evaluate -k 3 --json results/latest.json
      - name: Upload evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-python-${{ matrix.python-version }}
          path: results/latest.json
